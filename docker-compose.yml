# ============================================================
# DataPipeline Pro — PostgreSQL local via Docker
#
# Suba o banco com:
#   docker compose up -d
#
# O pipeline detecta automaticamente o PostgreSQL e, caso ele
# não esteja disponível, usa SQLite como fallback (demo sem setup).
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: datapipeline_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: datapipeline
      POSTGRES_PASSWORD: datapipeline
      POSTGRES_DB: datapipeline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapipeline -d datapipeline"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opcional: interface gráfica do banco (http://localhost:5050)
  # Descomente as linhas abaixo se quiser inspecionar as tabelas:
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: datapipeline_pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@admin.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #   ports:
  #     - "5050:80"
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  pgdata:
